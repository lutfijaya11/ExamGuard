name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS Simulator App (For Appetize.io Emulator)
        run: |
          flutter build ios --simulator --release
          SIM_APP=$(find build/ios -name "Runner.app" -type d | grep -i "simulator" | head -n 1)
          if [ -z "$SIM_APP" ]; then
            SIM_APP=$(find build/ios -name "Runner.app" -type d | head -n 1)
          fi
          echo "Simulator App at: $SIM_APP"
          cd $(dirname "$SIM_APP")
          zip -r ../../../ExamGuard-iOS-Simulator.zip Runner.app
          cd ../../..

      - name: Upload Simulator Zip (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-Simulator
          path: ExamGuard-iOS-Simulator.zip

      - name: Build iOS Physical Device App (For Sideloadly & Real iPhone)
        run: |
          flutter build ios --release --no-codesign
          APP_PATH=$(find build/ios -name "Runner.app" -type d | grep -iv "simulator" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          fi
          echo "Physical Device App at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact (For Real iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
