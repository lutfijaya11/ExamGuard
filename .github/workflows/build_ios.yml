name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS App with Diagnostics
        run: |
          echo "=== RUNNING FLUTTER BUILD IOS ==="
          flutter build ios --release --no-codesign 2>&1 | tee full_xcode.log || true
          echo "==================== FULL XCODE LOG START ===================="
          cat full_xcode.log
          echo "==================== FULL XCODE LOG END ======================"

      - name: Package and Check App
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | grep -iv "simulator" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Build had errors above."
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
