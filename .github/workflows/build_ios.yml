name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS Physical Device App (For Real iPhone & Sideloadly)
        run: |
          flutter build ios --release --no-codesign
          APP_PATH=$(find build/ios -name "Runner.app" -type d | grep -iv "simulator" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          fi
          echo "Packaging real device app from: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ExamGuard-iOS-unsigned.ipa

      - name: Upload IPA Artifact (For Real iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa

      - name: Build iOS Simulator App (For Appetize.io)
        run: |
          flutter build ios --simulator
          SIM_PATH=$(find build/ios -name "Runner.app" -type d | grep -i "simulator" | head -n 1)
          if [ -z "$SIM_PATH" ]; then
            echo "Simulator app not found"
            exit 1
          fi
          echo "Packaging simulator app from: $SIM_PATH"
          cd $(dirname "$SIM_PATH")
          zip -r -y ../../../ExamGuard-iOS-Simulator.zip Runner.app
          cd ../../..
          ls -lh ExamGuard-iOS-Simulator.zip
        continue-on-error: true

      - name: Upload Simulator Zip (For Appetize.io)
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ExamGuard-iOS-Simulator
          path: ExamGuard-iOS-Simulator.zip
