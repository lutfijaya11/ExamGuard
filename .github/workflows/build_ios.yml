name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS App
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build_output.log || true

      - name: Check Build & Output Log if Failed
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "==================== BUILD FAILED ===================="
            echo "SHOWING DETAILED LOGS:"
            tail -n 150 build_output.log
            echo "======================================================"
            exit 1
          fi

      - name: Package Payload into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
