name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS App
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into unsigned IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in build directory!"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found compiled iOS app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ExamGuard-iOS-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
