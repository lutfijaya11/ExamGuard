name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-simulator:
    name: Build iOS Simulator (for Appetize.io)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Dependencies and Remove CocoaPods Conflict
        run: |
          flutter pub get
          cd ios
          pod deintegrate || true
          rm -f Podfile Podfile.lock
          cd ..

      - name: Build iOS Simulator App
        run: |
          echo "=== Building iOS Simulator App ==="
          flutter build ios --simulator
          SIM_APP=$(find build/ios -name "Runner.app" -type d | grep -i "simulator" | head -n 1)
          if [ -z "$SIM_APP" ]; then
            SIM_APP=$(find build/ios -name "Runner.app" -type d | head -n 1)
          fi
          if [ -z "$SIM_APP" ]; then
            echo "ERROR: Runner.app not found!"
            exit 1
          fi
          echo "Simulator Runner.app found at: $SIM_APP"
          mkdir -p simulator_app
          cp -r "$SIM_APP" simulator_app/

      - name: Upload Simulator App (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-Simulator
          path: simulator_app/Runner.app

  build-device:
    name: Build iOS Physical Device (for Sideloadly / 3uTools)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Dependencies and Remove CocoaPods Conflict
        run: |
          flutter pub get
          cd ios
          pod deintegrate || true
          rm -f Podfile Podfile.lock
          cd ..

      - name: Build iOS Physical App
        run: |
          echo "=== Building iOS Physical App (Release) ==="
          flutter build ios --release --no-codesign
          DEV_APP=$(find build/ios -name "Runner.app" -type d | grep -iv "simulator" | head -n 1)
          if [ -z "$DEV_APP" ]; then
            DEV_APP=$(find build/ios -name "Runner.app" -type d | head -n 1)
          fi
          if [ -z "$DEV_APP" ]; then
            echo "ERROR: Runner.app not found!"
            exit 1
          fi
          echo "Physical Runner.app found at: $DEV_APP"
          mkdir -p Payload
          cp -r "$DEV_APP" Payload/
          zip -r -y "$GITHUB_WORKSPACE/ExamGuard-iOS-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh ExamGuard-iOS-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
