name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get

      - name: Build iOS App
        id: build_step
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee xcode_build.log
        continue-on-error: true

      - name: Upload Build Log Always
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode_build_log
          path: xcode_build.log

      - name: Package Payload into unsigned IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Build likely had errors."
            echo "=== SUMMARY OF ERRORS ==="
            grep -E "error:|Error:|FAILED|fatal" xcode_build.log | head -n 30 || true
            echo "========================="
            exit 1
          fi
          echo "Found compiled iOS app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ExamGuard-iOS-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
