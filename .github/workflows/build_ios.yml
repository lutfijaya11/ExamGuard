name: Build ExamGuard iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-13
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java for Flutter
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install

      - name: Build iOS App (No Codesign for Simulator / Ad-Hoc Payload)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ExamGuard-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamGuard-iOS-unsigned
          path: ExamGuard-iOS-unsigned.ipa
